<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Tenmile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Courier+Prime:wght@400;700&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a Commission ledger lying open. Cyanotype survey plate and the book on the left leaf, the day on the right. */
:root {
  --paper: #dfe4d3;
  --paper-2: #d3d9c6;
  --paper-3: #c5ccb7;
  --ink: #18212c;
  --ink-soft: #46525c;
  --ink-faint: #76817f;
  --rule-blue: #7d9db6;
  --rule-red: #b24a5a;
  --hand-ink: #1b2f55;
  --cyan-deep: #0b2545;
  --cyan-pale: #dbe8ef;
  --v-ledger: #1f4f7d;
  --v-hand: #74540c;
  --v-ear: #256248;
  --v-dog: #992d2d;
  --v-preacher: #57367a;
  --v-river: #14666f;
  --f-display: 'IM Fell English SC', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Spectral', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-type: 'Courier Prime', 'Courier New', Courier, monospace;
  --f-hand: 'Cedarville Cursive', 'Snell Roundhand', 'Apple Chancery', cursive;
  color-scheme: light;
}

/* night ledger: the same book by lamplight */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #121a24; --paper-2: #18222f; --paper-3: #2a3746; --ink: #dde2d4; --ink-soft: #a4aeab; --ink-faint: #74818a; --rule-blue: #3d5d79; --rule-red: #a8505f; --hand-ink: #bcd0ec; --v-ledger: #82b3e3; --v-hand: #d6ad55; --v-ear: #72c29b; --v-dog: #e88585; --v-preacher: #bc9fe3; --v-river: #60c6cf; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #121a24; --paper-2: #18222f; --paper-3: #2a3746; --ink: #dde2d4; --ink-soft: #a4aeab; --ink-faint: #74818a; --rule-blue: #3d5d79; --rule-red: #a8505f; --hand-ink: #bcd0ec; --v-ledger: #82b3e3; --v-hand: #d6ad55; --v-ear: #72c29b; --v-dog: #e88585; --v-preacher: #bc9fe3; --v-river: #60c6cf; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--cyan-deep); color: var(--ink); font-family: var(--f-body); font-size: 16px; overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--rule-red); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; background: var(--paper); }
#bar { flex: none; display: flex; align-items: center; gap: 14px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--cyan-deep); color: var(--cyan-pale); }
#bar .brand { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .14em; }
#bar .clock { font-family: var(--f-type); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#bar nav { display: flex; gap: 6px; }
#bar nav button { white-space: nowrap; font-family: var(--f-type); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan-pale); border: 1px solid rgba(219, 232, 239, .4); padding: 8px 11px; min-height: 36px; }
#bar nav button:active { background: rgba(219, 232, 239, .15); }
#bar nav .only-narrow { display: none; }

#stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 44%) 1fr; }
#left { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--paper-2); border-right: 1px solid var(--paper-3); }
#plate { margin: 0; flex: none; position: relative; aspect-ratio: 8 / 5; max-width: 100%; background: var(--cyan-deep); overflow: hidden; }
#plate svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#plate .fade { position: absolute; inset: 0; background: var(--cyan-deep); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
#plate.swap .fade { opacity: 1; }
.pl-t { font: 700 12.5px var(--f-type); fill: #dbe8ef; letter-spacing: .08em; }
.pl-s { font: 10px var(--f-type); fill: #dbe8ef; letter-spacing: .1em; opacity: .85; }
.pl-m { font: 700 12px var(--f-type); fill: #dbe8ef; letter-spacing: .12em; paint-order: stroke; stroke: #0b2545; stroke-width: 4px; }
.pl-sign { font: 15px var(--f-display); fill: #dbe8ef; letter-spacing: .14em; }
.mk { cursor: pointer; }
.mk circle:nth-child(2) { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 50% { transform: scale(1.7); opacity: .35; } }
.ripples { animation: drift 7s linear infinite alternate; }
@keyframes drift { to { transform: translateX(22px); } }
.smoke { stroke-dasharray: 6 5; animation: smoke 5s linear infinite; }
@keyframes smoke { to { stroke-dashoffset: -44; } }
.riv { stroke-dasharray: 3 9; animation: smoke 9s linear infinite reverse; }

/* the book */
#book { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 20px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); position: relative; }
.book-inner { position: relative; padding-left: 34px; min-height: 100%; background-image: linear-gradient(var(--rule-blue), var(--rule-blue)); background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 46px; }
.book-inner::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 4px; border-left: 1px solid var(--rule-red); border-right: 1px solid var(--rule-red); opacity: .7; }
.book-head { font-family: var(--f-type); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; height: 46px; align-items: center; }
.book-head b { font-weight: 700; color: var(--ink); }
.book-rows { list-style: none; margin: 0; padding: 0; }
.book-rows li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: baseline; min-height: 40px; border-bottom: 1px solid var(--rule-blue); padding: 6px 2px 0 0; }
.book-rows .no { font-family: var(--f-type); font-size: .7rem; color: var(--ink-faint); }
.book-rows .nm { font-family: var(--f-hand); font-size: 1.22rem; line-height: 1.15; color: var(--hand-ink); min-width: 0; }
.book-rows .nm small { display: block; font-size: .8rem; opacity: .75; }
.book-rows .ag { font-family: var(--f-hand); font-size: 1.15rem; color: var(--hand-ink); }
.book-rows li.struck .nm, .book-rows li.struck .ag { text-decoration: line-through; text-decoration-color: var(--rule-red); text-decoration-thickness: 2px; opacity: .6; }
.book-rows li.blank { opacity: .6; }
.book-foot { font-family: var(--f-type); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); padding-top: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* the day */
#right { min-width: 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; background: var(--paper); scroll-behavior: smooth; }
#log { max-width: 35.5rem; margin: 0 auto; padding-block: 26px 46vh; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); font-size: 1.19rem; line-height: 1.52; }
#log > * { animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
#log p { margin: 0 0 .78em; }
.ln-n { color: var(--ink); }
.ln-p { padding-left: 1.1em; text-indent: -1.1em; }
.who { font-family: var(--f-display); letter-spacing: .08em; font-size: .92em; margin-right: .5em; color: var(--ink); }
.who::after { content: "."; }
.ln-v { margin: 0 0 .78em; padding: .1em 0 .1em .85em; border-left: 3px double currentColor; font-style: italic; }
.ln-v .who { font-style: normal; color: inherit; }
.ln-v .txt { color: var(--ink); }
.v-ledger { color: var(--v-ledger); } .v-hand { color: var(--v-hand); } .v-ear { color: var(--v-ear); } .v-dog { color: var(--v-dog); } .v-preacher { color: var(--v-preacher); } .v-river { color: var(--v-river); }
.ln-you { color: var(--ink-soft); padding-left: 1.1em; text-indent: -1.1em; }
.ln-you .who { color: var(--ink-soft); }
.ln-you.act { font-style: italic; text-indent: 0; padding-left: 0; }
.ln-note { font-family: var(--f-type); font-size: .72em; letter-spacing: .06em; color: var(--ink-soft); text-transform: uppercase; line-height: 1.5; }
.ln-form { font-family: var(--f-type); font-size: .8em; line-height: 1.5; white-space: pre-wrap; background: var(--paper-2); border: 1px solid var(--paper-3); border-top: 3px double var(--ink-soft); padding: 14px 16px; margin: .3em 0 1em; color: var(--ink); }
.ln-entry { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; border-top: 1px solid var(--rule-blue); border-bottom: 1px solid var(--rule-blue); padding: 9px 4px 5px 14px; margin: .2em 0 1em; position: relative; background: var(--paper-2); }
.ln-entry::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 3px; border-left: 1px solid var(--rule-red); border-right: 1px solid var(--rule-red); opacity: .7; }
.ln-entry .nm, .ln-entry .ag { font-family: var(--f-hand); font-size: 1.32em; line-height: 1.2; color: var(--hand-ink); }
.ln-entry .nm small { font-size: .7em; opacity: .75; margin-left: .5em; }
.ln-entry .wr { display: inline-block; clip-path: inset(0 100% 0 0); animation: wr 1.5s .25s cubic-bezier(.3, .1, .6, 1) forwards; }
@keyframes wr { to { clip-path: inset(-20% -2% -20% 0); } }
hr.sep { border: 0; height: 12px; margin: 1.3em auto 1.5em; width: 60px; background: linear-gradient(var(--ink-faint), var(--ink-faint)) center / 100% 1px no-repeat; opacity: .6; }

/* choices */
.opts { list-style: none; margin: 1.1em 0 0; padding: 0; counter-reset: o; border-top: 1px solid var(--ink-soft); }
.opts li { counter-increment: o; border-bottom: 1px solid var(--paper-3); }
.opts button { display: grid; grid-template-columns: 1.7em 1fr; width: 100%; padding: 12px 6px 12px 2px; min-height: 48px; align-items: baseline; line-height: 1.38; }
.opts button::before { content: counter(o) "."; font-family: var(--f-type); font-size: .74em; color: var(--ink-faint); }
.opts button:active { background: var(--paper-2); }
@media (hover: hover) { .opts button:hover { background: var(--paper-2); } }
.opts .o-act { font-style: italic; }
.opts .o-sub { display: block; font-size: .8em; color: var(--ink-soft); font-style: normal; margin-top: 2px; }
.opts .o-chk { display: block; font-family: var(--f-type); font-style: normal; font-size: .66em; letter-spacing: .09em; text-transform: uppercase; margin-top: 4px; }
.opts .o-chk .red { color: var(--v-dog); }
.opts .o-mod { display: block; font-family: var(--f-type); font-style: normal; font-size: .64em; letter-spacing: .04em; color: var(--ink-soft); margin-top: 1px; }
.opts .o-tag { font-family: var(--f-type); font-style: normal; font-size: .64em; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); margin-left: .6em; }
.opts li.spent button { opacity: .5; cursor: default; }
.cont { margin-top: .6em; }
.cont button { font-family: var(--f-type); font-size: .78em; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); padding: 14px 18px 14px 0; min-height: 48px; }
.cont button::after { content: " \25B8"; }

/* the throw */
.roll { border: 1px solid currentColor; padding: 12px 14px; margin: .2em 0 1em; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; background: var(--paper-2); }
.roll .dice { display: flex; gap: 8px; }
.die { width: 40px; height: 40px; border: 1.5px solid currentColor; border-radius: 6px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; background: var(--paper); }
.die i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; place-self: center; opacity: 0; }
.die i.on { opacity: 1; }
.roll.rolling .die { animation: tumble .16s linear infinite; }
@keyframes tumble { 25% { transform: rotate(9deg) translateY(-2px); } 75% { transform: rotate(-9deg) translateY(1px); } }
.roll .sum { font-family: var(--f-type); font-size: .7em; letter-spacing: .06em; text-transform: uppercase; line-height: 1.5; color: var(--ink); }
.roll .sum b { color: inherit; }
.roll .res { grid-column: 1 / -1; font-family: var(--f-display); font-size: 1.05em; letter-spacing: .1em; min-height: 1.3em; }
.roll .res.fail { color: var(--v-dog); }
.roll .res.pass { color: var(--v-ear); }

/* sheets */
#sheet { position: fixed; inset: 0; z-index: 30; background: rgba(11, 37, 69, .72); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet .card { background: var(--paper); width: min(34rem, 100%); max-height: 100%; overflow-y: auto; padding: 22px 24px 20px; border-top: 6px double var(--ink); box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
#sheet h2 { font-family: var(--f-display); font-weight: 400; letter-spacing: .12em; font-size: 1.3rem; margin: 0 0 12px; }
#sheet .close { font-family: var(--f-type); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--ink-soft); padding: 10px 16px; margin-top: 16px; min-height: 42px; }
#sheet .row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.vrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--paper-3); }
.vrow .nm { font-family: var(--f-display); letter-spacing: .08em; font-size: 1.05rem; }
.vrow .pips { font-family: var(--f-type); letter-spacing: .2em; font-size: .9rem; }
.vrow .gl { grid-column: 1 / -1; font-size: .95rem; color: var(--ink-soft); line-height: 1.4; }
.howto { font-size: .98rem; line-height: 1.5; color: var(--ink); }
.howto p { margin: 0 0 .7em; }
#sheet #book2 { padding: 0; }

/* title */
#title { position: fixed; inset: 0; z-index: 40; background: var(--cyan-deep); color: var(--cyan-pale); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); transition: opacity .9s ease; overflow: hidden; }
#title.gone { opacity: 0; pointer-events: none; }
#title .tplate { position: absolute; inset: 0; opacity: .5; }
#title .tplate svg { width: 100%; height: 100%; display: block; }
#title .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11, 37, 69, .25), rgba(11, 37, 69, .92) 75%); }
#title .in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 30rem; }
#title .over { font-family: var(--f-type); font-size: .74rem; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
#title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.4rem, 13vw, 6.6rem); letter-spacing: .16em; margin: 0; line-height: 1; padding-left: .16em; text-shadow: 0 2px 24px rgba(11, 37, 69, .9); }
#title .sub { font-family: var(--f-body); font-style: italic; font-size: 1.15rem; line-height: 1.5; opacity: .92; margin: 0; }
#title .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; align-items: stretch; min-width: 15rem; }
#title .btns button { font-family: var(--f-type); font-size: .86rem; letter-spacing: .2em; text-transform: uppercase; text-align: center; color: var(--cyan-pale); border: 1px solid var(--cyan-pale); padding: 15px 22px; min-height: 50px; background: rgba(11, 37, 69, .55); }
#title .btns button.primary { background: var(--cyan-pale); color: var(--cyan-deep); }
#title .fine { font-family: var(--f-type); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin-top: 10px; }

.fin { text-align: center; padding: 1.5em 0 0; }
.fin h3 { font-family: var(--f-display); font-weight: 400; font-size: 2rem; letter-spacing: .2em; margin: 0 0 .2em; }
.fin p { font-family: var(--f-type); font-size: .74em; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.fin button { font-family: var(--f-type); font-size: .8em; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--ink); padding: 14px 22px; margin-top: 12px; min-height: 48px; }

/* portrait and narrow: plate above, the day below, the book behind a button */
@media (max-aspect-ratio: 1/1), (max-width: 720px) {
  #stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  #left { border-right: 0; }
  #plate { aspect-ratio: auto; height: min(34vh, 62vw); }
  #book { display: none; }
  #bar nav .only-narrow { display: inline-block; }
  #log { padding-block: 20px 40vh; }
}
@media (max-width: 480px) {
  #log { font-size: 1.08rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #bar { gap: 8px; }
  #bar .clock { display: none; }
  #bar .brand { flex: 1; }
  #bar nav button { padding: 8px 6px; font-size: .62rem; letter-spacing: .06em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
  #right { scroll-behavior: auto; }
}

</style>
<div id="app">
  <header id="bar">
    <span class="brand">Tenmile</span>
    <span class="clock" id="clock"></span>
    <nav>
      <button id="b-book" class="only-narrow">Book</button>
      <button id="b-voices">Voices</button>
      <button id="b-sound">Sound on</button>
      <button id="b-menu" aria-label="Menu">Menu</button>
    </nav>
  </header>
  <main id="stage">
    <section id="left">
      <figure id="plate"><div id="plate-svg"></div><div class="fade"></div></figure>
      <aside id="book" aria-label="The ledger"></aside>
    </section>
    <section id="right" aria-live="polite"><div id="log"></div></section>
  </main>
</div>
<div id="sheet" hidden><div class="card"></div></div>
<div id="title">
  <div class="tplate"></div><div class="veil"></div>
  <div class="in">
    <span class="over">Valley Commission · Schedule C</span>
    <h1>Tenmile</h1>
    <p class="sub">A valley is to be flooded at dusk. You have a ledger, a mule, and one day to write down who lives there.</p>
    <div class="btns">
      <button id="t-cont" hidden>Take up the book</button>
      <button id="t-new" class="primary">Come down the grade</button>
    </div>
    <span class="fine">About fifteen minutes · Sound on is better</span>
  </div>
</div>
<script>
/* Plates: cyanotype survey drawings, 800x500. Each returns inner SVG. */
const PL = '#dbe8ef';
function fig(x, y, s, opts) {
  // small standing figure, feet at x,y, height ~ 26*s
  opts = opts || {};
  const h = 26 * s;
  let g = `<g transform="translate(${x} ${y})" fill="${PL}">`;
  g += `<circle cx="0" cy="${-h}" r="${3.2 * s}"/>`;
  if (opts.skirt) g += `<path d="M${-3 * s} ${-h + 4 * s} L${3 * s} ${-h + 4 * s} L${5.5 * s} 0 L${-5.5 * s} 0 Z"/>`;
  else g += `<path d="M${-3.4 * s} ${-h + 4 * s} L${3.4 * s} ${-h + 4 * s} L${3 * s} ${-h * 0.42} L${3.6 * s} 0 L${1 * s} 0 L0 ${-h * 0.38} L${-1 * s} 0 L${-3.6 * s} 0 L${-3 * s} ${-h * 0.42} Z"/>`;
  if (opts.hat) g += `<path d="M${-6 * s} ${-h - 1.6 * s} L${6 * s} ${-h - 1.6 * s} L${3 * s} ${-h - 2.6 * s} L${2.6 * s} ${-h - 5.6 * s} L${-2.6 * s} ${-h - 5.6 * s} L${-3 * s} ${-h - 2.6 * s} Z"/>`;
  g += `</g>`;
  return g;
}
function mule(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="${PL}">
  <path d="M-22 -22 C-10 -26 8 -26 18 -23 L26 -34 L29 -40 L31 -34 L34 -39 L35 -32 L42 -24 L40 -19 L32 -21 L24 -14 L22 0 L18 0 L17 -10 L-12 -9 L-14 0 L-18 0 L-19 -11 C-24 -13 -25 -18 -22 -22 Z"/>
  <path d="M-22 -21 C-27 -18 -27 -10 -25 -4" stroke="${PL}" stroke-width="1.6" fill="none"/></g>`;
}
function waterline(y, label) {
  return `<g class="wl"><line x1="18" x2="782" y1="${y}" y2="${y}" stroke="${PL}" stroke-width="1.2" stroke-dasharray="14 7 2 7" opacity=".9"/>
  <text x="776" y="${y - 7}" text-anchor="end" class="pl-t">${label || 'PROPOSED WATER SURFACE · EL. 412'}</text>
  <path d="M30 ${y} l-6 -9 h12 z" fill="${PL}"/></g>`;
}
function frame(no, name) {

function plateSVG(id, S) {

/* TENMILE — the script. Each node is a function of state S returning {plate, beats, opts}. */
const N = t => ({ k: 'n', t });
const P = (who, t) => ({ k: 'p', who, t });
const V = (v, min, t) => ({ k: 'v', v, min, t });
const FORM = t => ({ k: 'form', t });
const ENTRY = key => ({ k: 'entry', key });
const NOTE = t => ({ k: 'note', t });

const VOICES = {
  ledger: { name: 'The Ledger', gloss: 'Sums, statutes, the letter of the instruction. It is never wrong and seldom any help.' },
  hand: { name: 'The Hand', gloss: 'Rope, shovel, iron. What the body knew before you took up the pen.' },
  ear: { name: 'The Ear', gloss: 'What a person means under what they say. It hears the plate that was glued.' },
  dog: { name: 'The Dog', gloss: 'The hair on your neck. It knows who is behind the door and it is not ashamed of anything.' },
  preacher: { name: 'The Preacher', gloss: 'The voice that moves other men. It believes every word while it is saying it.' },
  river: { name: 'The River', gloss: 'Not yours. It speaks from the valley floor and it has no stake in the outcome.' }
};
const TIMES = ['First light', 'Morning', 'Noon', 'Afternoon', 'Late afternoon', 'Dusk'];

function write(S, key, name, age, note, truth) {
  if (S.book.find(e => e.key === key)) return;
  S.book.push({ key, name, age, note: note || '', truth: truth !== false, struck: false });
}
const has = (S, key) => S.book.find(e => e.key === key && !e.struck);
const count = S => S.book.filter(e => !e.struck).length;
const lies = S => S.book.filter(e => !e.struck && !e.truth).length + (S.f.tarr === 'off' ? 1 : 0);

const STORY = {

  /* ---------------- THE GRADE ---------------- */
  grade: S => ({
    plate: 'valley',
    beats: [[
      N(`You come down the grade at first light leading the mule. The road is cut into the hill and below it the valley lies in its own shadow with the river in the floor of it like a thing dropped.`),
      N(`At the head of the valley stands the dam. It is white and it is new and nothing else in that country is either.`),
      N(`The town is called Tenmile. Eleven roofs and a church. Smoke from one chimney.`)
    ], [
      N(`In the saddlebag is a ledger of the Commission and a bottle of ink and a voucher for thirty dollars which is your wage. The instructions are pasted inside the cover. You have read them in four other valleys.`),
      FORM(`SCHEDULE C. ENUMERATION OF SOULS.\n\n1. The Enumerator shall enter every person resident in the valley on the day of the count.\n2. Each person entered is allowed forty dollars for removal.\n3. Each person entered shall be removed above the waterline by the constabulary before the gates are closed.\n4. A person not entered is not resident. The Commission has no concern with him.\n5. The gates close at dusk.`)
    ]],
    opts: [{ t: 'Close the book.', act: 1, go: 'grade2' }]
  }),
  grade2: S => ({
    plate: 'valley',
    beats: [[
      N(`The mule stops in the road and will not be led. You stand with it. There is no wind yet. In the quiet you can hear them start up, the way they do when there is work ahead and nobody by.`),
      { k: 'v', v: 'ledger', min: 0, t: `Eleven roofs. One smoke. Say five souls, seven at the outside. Two hundred dollars to two hundred eighty. We will know by noon.` },
      { k: 'v', v: 'hand', min: 0, t: `The mule's off hind shoe is loose. You felt it a mile back and did nothing.` },
      { k: 'v', v: 'ear', min: 0, t: `No dogs barking. A town with no dogs has left already.` },
      { k: 'v', v: 'dog', min: 0, t: `Somebody down there is watching you. I dont know who. I know it the way you know rain.` },
      { k: 'v', v: 'preacher', min: 0, t: `You carry the book of the living, brother. Walk like it.` },
      { k: 'v', v: 'river', min: 0, t: `I was here before the road. I will be here over it.` }
    ], [
      N(`Six of them. You have never been able to hear six at once. Two of them you trust more than the rest.`),
      NOTE(`Choose the first. A trusted voice speaks up more often and wins more of its throws.`)
    ]],
    opts: Object.keys(VOICES).map(k => ({ t: VOICES[k].name + '.', sub: VOICES[k].gloss, vc: k, silent: 1, do: S => { S.v[k] += 2; S.f.pick1 = k; }, go: 'grade3' }))
  }),
  grade3: S => ({
    plate: 'valley',
    beats: [[NOTE(`${VOICES[S.f.pick1].name} is with you. Choose the second.`)]],
    opts: Object.keys(VOICES).filter(k => k !== S.f.pick1).map(k => ({ t: VOICES[k].name + '.', sub: VOICES[k].gloss, vc: k, silent: 1, do: S => { S.v[k] += 2; S.f.pick2 = k; }, go: 'grade4' }))
  }),
  grade4: S => ({
    plate: 'valley',
    beats: [[
      NOTE(`${VOICES[S.f.pick1].name} and ${VOICES[S.f.pick2].name}. The others have not gone anywhere.`),
      N(`The mule goes on when it is ready. You go with it.`),
      N(`Tenmile is one street. The doors of the houses stand open and the rooms behind them are bare to the walls. Somebody has swept them.`)
    ]],
    opts: [{ t: 'Walk in.', act: 1, go: 'hub' }]
  }),

  /* ---------------- THE STREET (hub) ---------------- */
  hub: S => {
    if (S.f.raise > 0) return STORY.raise(S);
    const o = [];
    const done = k => S.f['done_' + k];
    o.push({ t: done('store') ? 'The store. Hallie Oake.' : 'The store, where the smoke is.', act: 1, go: done('store') ? 'store_back' : (S.f.metWren ? 'store_in' : 'store_porch'), tag: done('store') ? 'counted' : '' });
    if (S.f.told || done('store')) {
      o.push({ t: 'The churchyard, on the rise.', act: 1, go: done('church') ? 'church_back' : 'church', tag: done('church') ? 'settled' : '' });
      o.push({ t: 'The ferry.', act: 1, go: done('ferry') ? 'ferry_back' : 'ferry', tag: done('ferry') ? 'settled' : '' });
    }
    if (!S.f.shoe) o.push({ t: `See to the mule's shoe.`, act: 1, check: { id: 'shoe', v: 'hand', dc: 8, pass: 'shoe_ok', fail: 'shoe_bad' } });
    if (S.f.told || done('store')) o.push({ t: 'Go up to the works and hand in the book.', act: 1, go: 'dam_ask' });
    const lines = [];
    if (!S.f.hubSeen) { S.f.hubSeen = 1; lines.push(N(`You stand in the street with the mule. There is the store with its one smoke. Past the last house the ground rises to a church. Below the town the river.`)); }
    else {
      const t = ['', `The sun is on the east wall of the valley and the street is still in shade.`, `Noon. The shadows have gone in under things.`, `The light has crossed the river. The dam throws a shadow down the valley now, a mile long.`, `The dam's shadow has reached the first houses.`, `The light is going.`][Math.min(S.t, 5)];
      lines.push(N(`The street. ${t}`));
      if (S.f.wrenAlong && S.t === 2) lines.push(P('WREN', `When the water comes will the fish be in the houses.`), N(`You say you expect they will.`), P('WREN', `Granny Oake swept for fish then.`));
      if (S.f.wrenAlong && S.t === 3) lines.push(P('WREN', `How many is it now.`), N(`You tell her. ${count(S)}.`), P('WREN', `That aint many for a town.`));
    }
    return { plate: 'valley', beats: [lines], opts: o };
  },
  raise: S => ({
    plate: 'valley',
    beats: [[
      N(S.f.raised ? `Coming up from the river you find you are listening harder than you were. One of them has gained on the others again.` : `Walking back up the street something has shifted in you the way a load shifts on a mule. One of them is louder than it was.`),
      NOTE(`Raise one voice by a point.`)
    ]],
    opts: Object.keys(VOICES).map(k => ({ t: `${VOICES[k].name}.`, sub: `Now ${S.v[k]}. ${VOICES[k].gloss}`, vc: k, silent: 1, do: S => { S.v[k] += 1; S.f.raise -= 1; S.f.raised = 1; }, go: 'hub' }))
  }),
  shoe_ok: S => {
    S.f.shoe = 'ok';
    return {
      plate: 'valley', beats: [[
        N(`You lift the hoof into your lap. Two nails gone and a third backing out. You have no nails. You draw the good ones and reset them where the wall is sound and clinch them over with the back of the hoof knife and a river stone.`),
        V('hand', 0, `It will hold to Corley. That's one true thing done today and it's not noon.`),
        S.f.wrenAlong ? P('WREN', `He let you. He bit the Commission man.`) : N(`The mule sets the foot down and tries it and looks at nothing.`)
      ]], opts: [{ t: 'Go on.', act: 1, go: 'hub' }]
    };
  },
  shoe_bad: S => {
    S.f.shoe = 'bad';
    return {
      plate: 'valley', beats: [[
        N(`You lift the hoof into your lap. The mule lets you get settled. Then it takes the foot back and puts it down on yours.`),
        V('hand', 0, `Eleven years of pens.`),
        N(`You stand in the street on one leg. The shoe is as loose as it was. The mule looks at the dam.`),
        S.f.wrenAlong ? P('WREN', `He done that to the Commission man too.`) : null
      ]], opts: [{ t: 'Go on, limping.', act: 1, go: 'hub' }]
    };
  },

  /* ---------------- THE STORE ---------------- */
  store_porch: S => ({
    plate: 'store',
    beats: [[
      N(`The store has a gallery and a bench. On the bench sits a girl of nine or ten with an open tin of peaches in her lap. She is eating them with her fingers. She watches you tie the mule.`),
      P('WREN', `Are you the man that counts.`)
    ]],
    opts: [{ t: 'I am.', go: 'store_porch2' }, { t: 'Who says a man is coming.', go: 'store_porch2' }]
  }),
  store_porch2: S => {
    S.f.metWren = 1;
    return {
      plate: 'store',
      beats: [[
        P('WREN', `Granny Oake said a man would come and count us and then they'd let the water in. She said be civil.`),
        N(`She looks at the mule.`),
        P('WREN', `Does he count.`)
      ]],
      opts: [
        { t: `He's from outside the valley. He doesnt count.`, go: 'store_mule_a' },
        { t: `Mules arent souls. It's in the instructions.`, go: 'store_mule_b' },
        { t: `I'll ask him.`, go: 'store_mule_c' }
      ]
    };
  },
  store_mule_a: S => ({ plate: 'store', beats: [[P('WREN', `He's in it now.`), N(`You have no answer to that. You go in.`)]], opts: [{ t: 'Go in.', act: 1, go: 'store_in' }] }),
  store_mule_b: S => ({ plate: 'store', beats: [[P('WREN', `Who wrote the instructions.`), N(`The Commission, you tell her.`), P('WREN', `Did they ask a mule.`)]], opts: [{ t: 'Go in.', act: 1, go: 'store_in' }] }),
  store_mule_c: S => ({ plate: 'store', beats: [[N(`You look at the mule. The mule looks at the dam.`), P('WREN', `He dont know either.`)]], opts: [{ t: 'Go in.', act: 1, go: 'store_in' }] }),

  store_in: S => ({
    plate: 'store',
    beats: [[
      N(`Inside the shelves are near bare. A woman stands on a crate taking down the last of the lamp chimneys and wrapping each one in newspaper. She doesnt turn around.`),
      P('HALLIE', `Coffee's on the stove. I aint selling it. I quit selling Tuesday. Take what you want, there's not much left that's worth the carrying.`),
      V('hand', 2, `Tin cup on a nail by the stove. The coffee has been boiled twice. Drink it anyway.`),
      N(`You set the ledger on the counter and open it and draw the cork from the ink. She hears the cork and comes down off the crate.`),
      P('HALLIE', `Hallie Oake. Sixty-one. Born in that back room and I'd as soon you wrote that too but I dont guess there's a column for it.`)
    ]],
    opts: [{ t: 'Write her down.', act: 1, do: S => write(S, 'hallie', 'Hallie Oake', 61, 'storekeeper'), go: 'store_in2' }]
  }),
  store_in2: S => ({
    plate: 'store',
    beats: [[
      N(`There is not a column for it.`),
      ENTRY('hallie'),
      P('HALLIE', `And the girl. Wren Oake. Nine.`),
      V('ear', 2, `She set that second name down careful. Like a plate she'd glued.`),
      N(`From the doorway behind you:`),
      P('WREN', `It's Tolliver.`),
      P('HALLIE', `Hush.`),
      P('WREN', `Well it is.`)
    ]],
    opts: [{ t: 'Which is it.', go: 'store_wren' }]
  }),
  store_wren: S => ({
    plate: 'store',
    beats: [[
      P('HALLIE', `Her people went out in April with a wagon and six children and when they got to the top of the grade they had five. I dont say they meant it. Nobody come back.`),
      P('HALLIE', `You write Tolliver and the county has her in the home at Ansel by Sunday. You write Oake and she goes with me to my sister's in Corley and nobody looks at her twice.`),
      V('ledger', 0, `The instruction says every person resident. It doesnt say under what name. That's a thin place in the paper and you know it's thin.`),
      V('preacher', 2, `A false name in the book of the living. A small one. They are always small at first.`)
    ]],
    opts: STORY._wrenOpts(S)
  }),
  _wrenOpts: S => [
    { t: 'Write: Wren Oake, 9.', act: 1, do: S => { write(S, 'wren', 'Wren Oake', 9, 'ward of H. Oake', false); S.f.wren = 'oake'; }, go: 'store_wren_oake' },
    { t: 'Write: Wren Tolliver, 9.', act: 1, do: S => { write(S, 'wren', 'Wren Tolliver', 9, 'no kin present'); S.f.wren = 'tolliver'; }, go: 'store_wren_tol' },
    { t: 'Wren. What do you say.', check: { id: 'askwren', v: 'ear', dc: 8, pass: 'store_wren_ask_ok', fail: 'store_wren_ask_no' } }
  ],
  store_wren_ask_ok: S => ({
    plate: 'store',
    beats: [[
      N(`You dont look at the woman when you ask it. You look at the girl and you wait.`),
      P('WREN', `I dont care what I'm called. I aint going to Ansel. Addie Purdy went to Ansel and when we seen her again they'd cut her hair off.`),
      V('ear', 0, `Nobody gave her that to say. That's her own.`)
    ]],
    opts: STORY._wrenOpts(S).slice(0, 2)
  }),
  store_wren_ask_no: S => ({
    plate: 'store',
    beats: [[
      N(`The girl shrugs and eats a peach.`),
      V('ear', 0, `Nine years old and asked in front of the woman who feeds her. She's not going to hand you anything.`)
    ]],
    opts: STORY._wrenOpts(S).slice(0, 2)
  }),
  store_wren_oake: S => ({
    plate: 'store',
    beats: [[
      ENTRY('wren'),
      N(`The woman watches the pen. When it stops she lets her breath go.`),
      P('HALLIE', `I'll not thank you. If I thank you it's a thing we did.`)
    ]],
    opts: [{ t: 'Blot the line.', act: 1, go: 'store_talk' }]
  }),
  store_wren_tol: S => ({
    plate: 'store',
    beats: [[
      ENTRY('wren'),
      P('HALLIE', `Well. It's her name.`),
      N(`She goes back to the chimneys. She wraps one and then stands holding it.`),
      P('WREN', `Told you.`)
    ]],
    opts: [{ t: 'Blot the line.', act: 1, go: 'store_talk' }]
  }),
  store_talk: S => {
    const o = [];
    const a = S.f;
    if (!a.told) o.push({ t: 'Who else is left in the valley.', go: 'store_who' });
    if (a.told && !a.knowLyle) {
      if (a.slip) o.push({ t: 'You answered about the mill before I asked about the mill.', go: 'store_mill' });
      else o.push({ t: `Tell me again who's across the river.`, check: { id: 'hallie_mill', v: 'ear', dc: 9, pass: 'store_mill', fail: 'store_mill_no' } });
    }
    if (!a.qSwept) o.push({ t: 'Somebody swept the empty houses.', go: 'store_swept' });
    if (!a.qCorley) o.push({ t: 'What will you do in Corley.', go: 'store_corley' });
    if (!a.qDam) o.push({ t: 'What do they say the dam is for.', go: 'store_dam' });
    if (a.told) o.push({ t: 'Cork the ink and go.', act: 1, go: a.wrenAsked ? 'store_exit' : 'store_leave' });
    return { plate: 'store', beats: [[N(a.talked ? `She wraps another chimney.` : `She pours you the coffee herself after all and stands with her arms folded while you drink it.`)]], opts: (a.talked = 1, o) };
  },
  store_who: S => {
    S.f.told = 1;
    if (S.v.dog >= 2 || S.v.ledger >= 2) S.f.slip = 1;
    return {
      plate: 'store',
      beats: [[
        P('HALLIE', `Odile Vance is up at the churchyard, and you go easy up there. Abel Tarr's down at the ferry and you wont move him. That's the town. There's nobody across the river. Mill's been shut since spring.`),
        V('dog', 2, `You didnt ask her about across the river.`),
        V('ledger', 2, `One smoke. Two women, a child, an old man. Then who is she baking for. There are four loaf tins drying on that sill.`)
      ]],
      opts: [{ t: 'Nod.', act: 1, go: 'store_talk' }]
    };
  },
  store_mill: S => {
    S.f.knowMill = 1; S.f.knowLyle = 1;
    return {
      plate: 'store',
      beats: [[
        N(`She puts the lamp chimney down on the counter. She does it slowly so it wont ring.`),
        P('HALLIE', `It's my sister's boy. Lyle. He come in the night nine days back and I put him in the mill. I been sending bread over with Abel.`),
        P('HALLIE', `He done something in Ansel. I never asked what. I didnt want to have been told.`),
        P('HALLIE', `You could just not go over there. The book says resident. He aint resident. He's only there.`),
        V('ledger', 0, `Nine days. The instruction gives no term for resident. You have seen men counted on less.`)
      ]],
      opts: [{ t: 'Say nothing to that.', act: 1, go: 'store_talk' }]
    };
  },
  store_mill_no: S => ({
    plate: 'store',
    beats: [[
      P('HALLIE', `There's a mill across the river. It's shut. I said so.`),
      N(`She wraps a chimney and sets it in the crate with the others. That is all you will get here.`)
    ]],
    opts: [{ t: 'Let it lie.', act: 1, go: 'store_talk' }]
  }),
  store_swept: S => {
    S.f.qSwept = 1;
    return {
      plate: 'store', beats: [[
        P('HALLIE', `Somebody ought to.`),
        N(`You ask her why.`),
        P('HALLIE', `You dont leave a place dirty.`),
        V('river', 2, `She swept them for me. I will be in every one of those rooms by Thursday. I have no feeling about floors.`)
      ]], opts: [{ t: 'Drink the coffee.', act: 1, go: 'store_talk' }]
    };
  },
  store_corley: S => {
    S.f.qCorley = 1;
    return {
      plate: 'store', beats: [[
        P('HALLIE', `Sit in my sister's kitchen and be told where things are kept.`),
        V('ear', 2, `Sixty-one years she has known where everything was kept.`)
      ]], opts: [{ t: 'Drink the coffee.', act: 1, go: 'store_talk' }]
    };
  },
  store_dam: S => {
    S.f.qDam = 1;
    return {
      plate: 'store', beats: [[
        P('HALLIE', `Lights for the cities. I been to a city once. They had enough lights.`)
      ]], opts: [{ t: 'Drink the coffee.', act: 1, go: 'store_talk' }]
    };
  },
  store_leave: S => {
    S.f.wrenAsked = 1;
    return {
      plate: 'store',
      beats: [[
        N(`You cork the ink. The girl is standing at your elbow.`),
        P('WREN', `I can carry that.`),
        P('HALLIE', `She'll follow you anyhow. She's like a burr.`)
      ]],
      opts: [
        { t: 'Carry it level.', do: S => { S.f.wrenAlong = 1; }, go: 'store_exit' },
        { t: 'Stay with your granny.', go: 'store_stay' }
      ]
    };
  },
  store_stay: S => ({
    plate: 'store', beats: [[P('WREN', `She aint my granny. I just call her it.`), N(`She goes back out to the bench and the peaches.`)]],
    opts: [{ t: 'Go out.', act: 1, go: 'store_exit' }]
  }),
  store_exit: S => {
    if (!S.f.done_store) { S.f.done_store = 1; S.t = Math.max(S.t, 1); S.f.raise = (S.f.raise || 0) + 1; }
    return STORY.hub(S);
  },
  store_back: S => ({
    plate: 'store',
    beats: [[
      N(`The crate of lamp chimneys is full and nailed shut. She is sitting on it.`),
      P('HALLIE', S.f.done_church && S.f.done_ferry ? `You seen them all then. Go on up. Dont stand in here on my account.` : `You aint done. I can see the dam from here and I can see you.`),
      !S.f.wrenAlong && !S.f.done_ferry ? P('WREN', `I can still carry the ink.`) : null
    ]],
    opts: [
      (!S.f.wrenAlong && !S.f.done_ferry) ? { t: 'Come on then. Carry it level.', do: S => { S.f.wrenAlong = 1; }, go: 'hub' } : null,
      (S.f.told && !S.f.knowLyle && S.f.slip) ? { t: 'You answered about the mill before I asked about the mill.', go: 'store_mill' } : null,
      { t: 'Go out.', act: 1, go: 'hub' }
    ].filter(Boolean)
  }),

  /* ---------------- THE CHURCHYARD ---------------- */
  church: S => ({

    Object.keys(VOICES).forEach(k => { h += `<div class="vrow v-${k}"><span class="nm">${VOICES[k].name}</span><span class="pips">${'●'.repeat(S.v[k])}${'○'.repeat(Math.max(0, 5 - S.v[k]))}</span><span class="gl">${esc(VOICES[k].gloss)}</span></div>`; });
    h += `<div class="howto" style="margin-top:14px"><p>When you lean on a voice it throws two dice and adds its number. Meet the figure and it holds. Two sixes always hold. Two ones never do.</p><p>Some throws can be tried again when the voice has grown. Some can be thrown only once.</p></div>`;

  function bookSheet() { sheet('<h2>The Book</h2><div id="book2">' + bookHTML() + '</div>'); }

  /* ---------- boot ---------- */
  function begin(newGame) {
    if (newGame || !S) { S = fresh(); clearSave(); }
    log().innerHTML = ''; scroller().scrollTop = 0; curPlateKey = ''; busy = false;
    const t = $('#title'); t.classList.add('gone'); setTimeout(() => { t.hidden = true; t.querySelector('.tplate').innerHTML = ''; }, 950);
    $('#plate-svg').innerHTML = '';
    go(S.node);
  }
  function start(hot) {
    let sOn = true; try { sOn = localStorage.getItem('tenmile.sound') !== '0'; } catch (e) { }
    A.on = sOn; $('#b-sound').textContent = sOn ? 'Sound on' : 'Sound off';
    $('#b-sound').onclick = () => setSound(!A.on);
    $('#b-voices').onclick = voicesSheet; $('#b-book').onclick = bookSheet; $('#b-menu').onclick = menuSheet;
    $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.target.hidden = true; });
    $('#plate').addEventListener('click', e => {
      const m = e.target.closest && e.target.closest('.mk'); if (!m || busy || !S || S.node !== 'hub') return;
      const map = { store: /store/i, church: /churchyard/i, ferry: /^The ferry/i, dam: /works/i };
      const loc = m.getAttribute('data-loc'); const btns = [...document.querySelectorAll('#log .opts:last-of-type button')];
      const b = btns.find(b => map[loc] && map[loc].test(b.textContent)); if (b) b.click();
    });
    const saved = (hot && hot.S) || load();
    $('#title .tplate').innerHTML = plateSVG('valley', { t: 0, f: { bare: 1 } });
    const bn = $('#t-new'), bc = $('#t-cont');
    if (saved && saved.node !== 'grade' && saved.node !== 'fin') { bc.hidden = false; bc.onclick = () => { S = saved; audioStart(); begin(false); }; bn.textContent = 'Begin again'; bn.classList.remove('primary'); bc.classList.add('primary'); }
    bn.onclick = () => { audioStart(); begin(true); };
    document.addEventListener('visibilitychange', () => { if (!A.ctx) return; if (document.hidden) A.ctx.suspend(); else if (A.on) A.ctx.resume(); });
    window.__tenmile = { get S() { return S; }, go };
  }
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ S })); } catch (e) { }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
